[package]
name = "seid"
version = "0.2.0"
edition = "2024"
authors = ["Sharkow"]
description = ""
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["id", "uuid", "base62", "no_std", "wasm"]
categories = ["data-structures", "no-std", "cryptography", "web-programming"]

[features]
default = ["std", "alloc", "sys-clock", "sys-rand"]
std = ["alloc", "thiserror/std"]
alloc = []
sys-clock = ["std"]
sys-rand = ["dep:getrandom"]
serde = ["dep:serde"]
subtle = ["dep:subtle"]

[dependencies]
thiserror = { version = "2.0.21", default-features = false }
fastrand = { version = "2.5.0", default-features = false }
xxhash-rust = { version = "0.8.19", default-features = false, features = ["xxh3"] }
blake3 = { version = "1.8.7", default-features = false }

getrandom = { version = "0.4.3", default-features = false, optional = true }
serde = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
subtle = { version = "2.6", default-features = false, optional = true }

[[bin]]
name = "seid"
path = "src/main.rs"
required-features = ["std"]
