[package]
name = "seid"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Sharkow"]
description = "A SEgmented ID system"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Sharkow1743/seid"
homepage = "https://github.com/Sharkow1743/seid"
documentation = "https://docs.rs/seid"
exclude = ["target/"]

[features]
default = ["std", "alloc", "sys-clock", "sys-rand"]
std = ["alloc", "thiserror/std"]
alloc = []
sys-clock = ["std"]
sys-rand = ["dep:getrandom"]
serde = ["dep:serde"]

[dependencies]
thiserror = { version = "2.0.21", default-features = false }
fastrand = { version = "2.5.0", default-features = false }
xxhash-rust = { version = "0.8.19", default-features = false, features = ["xxh3"] }
blake3 = { version = "1.8.7", default-features = false }

getrandom = { version = "0.4.3", default-features = false, optional = true }
serde = { version = "1.0", default-features = false, features = ["alloc"], optional = true }

[[bin]]
name = "seid"
path = "src/main.rs"
required-features = ["std"]
